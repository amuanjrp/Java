spring.application.name=projeto
spring.config.import=optional:file:.env[.properties]
# URL de conexão: Substitua 'seu_banco_de_dados' pelo nome do seu schema local
spring.datasource.url=${DB_URL}

# Credenciais de acesso ao banco
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Driver de Conexão (Opcional a partir do Spring Boot 2.x+, pois ele detecta automaticamente pela URL)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configurações do Hibernate / JPA
# Opções para ddl-auto: update, create, create-drop, none ou validate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
